<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#03060D" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Neon Dot Glow Filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtler Ambient Neon Glow behind B -->
    <filter id="ambient-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Card Background with Rounded Corners -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="6" />

  <!-- Subtle Inner Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2" />

  <g filter="url(#ambient-glow)">
    <!-- White Letter 'B' (Bold Geometric Serif / Modern Sans Hybrid) -->
    <path 
      fill-rule="evenodd" 
      clip-rule="evenodd" 
      d="M 144 116 H 244 C 294 116 328 144 328 188 C 328 218 308 240 274 248 C 316 256 340 282 340 324 C 340 372 300 396 244 396 H 144 V 116 Z M 204 164 V 228 H 238 C 264 228 276 216 276 196 C 276 176 264 164 238 164 H 204 Z M 204 276 V 348 H 242 C 272 348 286 334 286 312 C 286 290 272 276 242 276 H 204 Z" 
      fill="#FFFFFF" 
    />

    <!-- Neon Blue Glowing Dot '.' -->
    <circle cx="376" cy="364" r="32" fill="#00E5FF" filter="url(#neon-glow)" />
  </g>
</svg>
